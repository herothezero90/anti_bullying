<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Background accent -->
  <rect x="40" y="40" width="320" height="320" fill="#2A9D90" stroke="#000" stroke-width="6" />
  
  <!-- offset shadows -->
  <rect x="90" y="240" width="160" height="50" fill="#000" />
  <rect x="110" y="180" width="140" height="50" fill="#000" />
  <circle cx="185" cy="115" r="45" fill="#000" />
  <polygon points="255,100 295,100 295,280 255,280" fill="#000"/>
  <polygon points="255,280 295,280 275,320" fill="#000"/>

  <!-- Book 1 -->
  <rect x="80" y="230" width="160" height="50" fill="#CC5920" stroke="#000" stroke-width="6" />
  <line x1="100" y1="255" x2="220" y2="255" stroke="#000" stroke-width="4" stroke-linecap="round" />
  
  <!-- Book 2 -->
  <rect x="100" y="170" width="140" height="50" fill="#FFC942" stroke="#000" stroke-width="6" />
  <line x1="120" y1="195" x2="220" y2="195" stroke="#000" stroke-width="4" stroke-linecap="round" />
  
  <!-- Apple -->
  <circle cx="175" cy="105" r="45" fill="#FFC942" stroke="#000" stroke-width="6" />
  <path d="M 175 60 Q 195 20 215 40" fill="none" stroke="#000" stroke-width="6" stroke-linecap="round" />
  <path d="M 175 60 Q 140 50 135 80" fill="#2A9D90" stroke="#000" stroke-width="6" />
  
  <!-- Pencil -->
  <!-- Pencil Rubber -->
  <rect x="245" y="60" width="40" height="30" fill="#CC5920" stroke="#000" stroke-width="6" />
  <line x1="245" y1="75" x2="285" y2="75" stroke="#000" stroke-width="4" />
  
  <!-- Pencil Body -->
  <polygon points="245,90 285,90 285,270 245,270" fill="#FFC942" stroke="#000" stroke-width="6" />
  <line x1="265" y1="90" x2="265" y2="270" stroke="#000" stroke-width="4" />
  
  <!-- Pencil Tip -->
  <polygon points="245,270 285,270 265,310" fill="#F9F5F2" stroke="#000" stroke-width="6" />
  <!-- Lead -->
  <polygon points="255,290 275,290 265,310" fill="#000" stroke="#000" stroke-width="4" />
</svg>
