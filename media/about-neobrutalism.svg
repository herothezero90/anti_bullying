<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Background offset shadow -->
  <rect x="50" y="50" width="300" height="300" rx="150" fill="#000" />
  <!-- Background circle -->
  <rect x="40" y="40" width="300" height="300" rx="150" fill="#FFC942" stroke="#000" stroke-width="6" />
  
  <!-- Shield Shadow -->
  <path d="M 210 100 L 300 100 L 300 220 Q 300 320 210 350 Q 120 320 120 220 L 120 100 Z" fill="#000" />
  
  <!-- Shield -->
  <path d="M 200 90 L 290 90 L 290 210 Q 290 310 200 340 Q 110 310 110 210 L 110 90 Z" fill="#2A9D90" stroke="#000" stroke-width="6" stroke-linejoin="round" />
  
  <!-- Band across shield -->
  <polygon points="110,160 290,160 290,210 110,210" fill="#FFC942" stroke="#000" stroke-width="6" />
  
  <!-- Heart in center -->
  <path d="M 200 130 C 200 130 180 100 160 120 C 140 140 160 170 200 200 C 240 170 260 140 240 120 C 220 100 200 130 200 130 Z" fill="#CC5920" stroke="#000" stroke-width="6" stroke-linejoin="round" />
  
  <path d="M 200 240 L 200 280" stroke="#000" stroke-width="8" stroke-linecap="round" />
  <path d="M 180 260 L 220 260" stroke="#000" stroke-width="8" stroke-linecap="round" />
</svg>
